<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 760' width='1200' height='760' font-family='Poppins, Segoe UI, Arial, sans-serif'><title>How a journey map works</title><rect width='1200' height='760' fill='#fff'/><rect width='1200' height='74' fill='#14283F'/><text x='32' y='36' font-size='22' fill='#fff' font-weight='700' text-anchor='start'>How a journey map works</text><text x='32' y='60' font-size='13' fill='#B9D3DC' font-weight='400' text-anchor='start'>Read across for the story, down for each moment — then find where the outcome leaks</text><text x='1168' y='44' font-size='12' fill='#B9D3DC' font-weight='500' text-anchor='end'>BAS · Horizons: Initiative</text><rect x='32' y='100' width='200' height='70' fill='#14283F' stroke='#D5E2E7'/><text x='46' y='130' font-size='12.5' fill='#fff' font-weight='700' text-anchor='start'>STAGES</text><text x='46' y='150' font-size='10.5' fill='#B9D3DC' font-weight='400' text-anchor='start'>The actor&#x27;s phases, in their words</text><rect x='232.0' y='100' width='187.2' height='70' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='419.2' y='100' width='187.2' height='70' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='606.4' y='100' width='187.2' height='70' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='793.6' y='100' width='187.2' height='70' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='980.8' y='100' width='187.2' height='70' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='32' y='170' width='200' height='70' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='200' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>DOES</text><text x='46' y='220' font-size='10.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Actions and touchpoints</text><rect x='232.0' y='170' width='187.2' height='70' fill='#fff' stroke='#D5E2E7'/><rect x='419.2' y='170' width='187.2' height='70' fill='#fff' stroke='#D5E2E7'/><rect x='606.4' y='170' width='187.2' height='70' fill='#fff' stroke='#D5E2E7'/><rect x='793.6' y='170' width='187.2' height
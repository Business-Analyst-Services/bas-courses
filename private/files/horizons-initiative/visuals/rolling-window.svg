<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 470' width='1200' height='470' font-family='Poppins, Segoe UI, Arial, sans-serif'><title>The rolling planning window</title><rect width='1200' height='470' fill='#fff'/><rect width='1200' height='74' fill='#14283F'/><text x='32' y='36' font-size='22' fill='#fff' font-weight='700' text-anchor='start'>The rolling planning window</text><text x='32' y='60' font-size='13' fill='#B9D3DC' font-weight='400' text-anchor='start'>Roughly one to three months · elaborate in waves · Chapter 6.4</text><text x='1168' y='44' font-size='12' fill='#B9D3DC' font-weight='500' text-anchor='end'>BAS · Horizons: Initiative</text><rect x='32' y='100' width='330' height='250' rx='12' fill='#1789A0' stroke='#D5E2E7' stroke-width='1.5'/><text x='52' y='132' font-size='15' fill='#fff' font-weight='700' text-anchor='start'>READY</text><text x='52' y='154' font-size='12.5' fill='#fff' font-weight='400' text-anchor='start'>Next 1–2 iterations</text><rect x='52' y='176' width='290' height='30' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><rect x='52' y='214' width='290' height='30' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><rect x='52' y='252' width='290' height='30' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><text x='52' y='330' font-size='11.5' fill='#fff' font-weight='400' text-anchor='start'>Elaborated: scope, initial acceptance</text><text x='52' y='345' font-size='11.5' fill='#fff' font-weight='400' text-anchor='start'>conditions, risks, dependencies</text><rect x='367' y='100' width='400' height='250' rx='12' fill='#D9EBEF' stroke='#D5E2E7' stroke-width='1.5'/><text x='387' y='132' font-size='15' fill='#14283F' font-weight='700' text-anchor='start'>FEATURE LEVEL</text><text x='387' y='154' font-size='12.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Weeks to ~2 months out</text><rect x='387' y='176' width='320' height='40' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><rect x='387' y='224' width='320' height='40' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><rect x='387' y='272' width='320' height='40' rx='6' fill='#fff' stroke='#1789A0' stroke-width='1.5'/><text x='387' y='330' font-size='11.5' fill='#21313D' font-weight='400' text-anchor='start'>Understood as features;</text><text x='387' y='345' font-size='11.5' fill='#21313D' font-weight='400' text-anchor='start'>not yet decomposed into stories</text><rect x='772' y='100' width='406' height='250' rx='12' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><text x='792' y='132' font-size='15' fill='#14283F' font-weight='700' text-anchor='start'>PLACEHOLDERS</text><text x='792' y='154' font-size='12.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Outer edge (~3 months)</text><rect x='792' y='176' width='266' height='46' rx='6' fill='#fff' stroke='#5B6B75' stroke-width='1.5' stroke-dasharray='5 4'/><rect x='792' y='230' width='266' height='46' rx='6' fill='#fff' stroke='#5B6B75' stroke-width='1.5' stroke-dasharray='5 4'/><text x='792' y='330' font-size='11.5' fill='#21313D' font-weight='400' text-anchor='start'>Directional markers on the roadmap,</text><text x='792' y='345' font-size='11.5' fill='#21313D' font-weight='400' text-anchor='start'>elaborated as they approach</text><path d='M40,380 L1160,380' stroke='#14283F' stroke-width='2'/><path d='M1160,380 l-10,-6 v12 z' fill='#14283F'/><text x='40' y='402' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>Now</text><text x='1160' y='402' font-size='12' fill='#14283F' font-weight='700' text-anchor='end'>Further out — held lightly</text><text x='32' y='440' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='start'>Rhythm: weekly backlog refinement · monthly product roadmap review · discovery and planning workshops as needed. Never let the Delivery Team run out of ready work.</text></svg>
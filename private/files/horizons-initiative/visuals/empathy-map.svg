<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 760' width='1200' height='760' font-family='Poppins, Segoe UI, Arial, sans-serif'><title>Customer empathy map — Mia, the receiver</title><rect width='1200' height='760' fill='#fff'/><rect width='1200' height='74' fill='#14283F'/><text x='32' y='36' font-size='22' fill='#fff' font-weight='700' text-anchor='start'>Customer empathy map — Mia, the receiver</text><text x='32' y='60' font-size='13' fill='#B9D3DC' font-weight='400' text-anchor='start'>Illustrative · built from receiver interviews and complaints</text><text x='1168' y='44' font-size='12' fill='#B9D3DC' font-weight='500' text-anchor='end'>BAS · Horizons: Initiative</text><rect x='32' y='96' width='564' height='228' rx='12' fill='#fff' stroke='#D5E2E7' stroke-width='1.5'/><text x='52' y='126' font-size='13' fill='#1789A0' font-weight='700' text-anchor='start'>THINKS AND FEELS</text><rect x='52' y='146' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='171' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>&quot;I can&#x27;t lose another shift.&quot;</text><rect x='52' y='198' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='223' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Anxious about a 30 kg box</text><rect x='52' y='250' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='275' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Distrusts &quot;between 7 am and 7 pm&quot;</text><rect x='604' y='96' width='564' height='228' rx='12' fill='#fff' stroke='#D5E2E7' stroke-width='1.5'/><text x='1148' y='126' font-size='13' fill='#1789A0' font-weight='700' text-anchor='end'>HEARS</text><rect x='624' y='146' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='171' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Friends: &quot;just get it sent to work&quot;</text><rect x='624' y='198' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='223' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Retailer: &quot;ships in 1–2 days&quot;</text><rect x='624' y='250' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='275' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Colleagues swapping shifts for deliveries</text><rect x='32' y='334' width='564' height='228' rx='12' fill='#fff' stroke='#D5E2E7' stroke-width='1.5'/><text x='52' y='364' font-size='13' fill='#1789A0' font-weight='700' text-anchor='start'>SEES</text><rect x='52' y='384' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='409' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Tracking stuck on &quot;in transit&quot;</text><rect x='52' y='436' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='461' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>A card in the letterbox at 4 pm</text><rect x='52' y='488' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='66' y='513' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>A depot 40 minutes away</text><rect x='604' y='334' width='564' height='228' rx='12' fill='#fff' stroke='#D5E2E7' stroke-width='1.5'/><text x='1148' y='364' font-size='13' fill='#1789A0' font-weight='700' text-anchor='end'>SAYS AND DOES</text><rect x='624' y='384' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='409' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Checks tracking many times a day</text><rect x='624' y='436' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='461' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Calls the contact centre</text><rect x='624' y='488' width='420' height='40' rx='6' fill='#D9EBEF'/><text x='638' y='513' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>Asks a neighbour to watch out</text><circle cx='600' cy='330' r='62' fill='#fff' stroke='#14283F' stroke-width='2'/><circle cx='600' cy='324' r='38' fill='#D9EBEF'/><circle cx='600' cy='315.64' r='12.920000000000002' fill='#1789A0'/><path d='M576.44,347.56 a23.56,19.0 0 0 1 47.12,0' fill='#1789A0'/><text x='600' y='378' font-size='12' fill='#14283F' font-weight='700' text-anchor='middle'>Mia</text><rect x='32' y='578' width='564' height='160' rx='12' fill='#F2F8FA' stroke='#dc2626' stroke-width='1.5'/><text x='52' y='606' font-size='13' fill='#dc2626' font-weight='700' text-anchor='start'>PAINS</text><text x='52' y='636' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  Missed delivery on a night shift</text><text x='52' y='662' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  No say in when it comes</text><text x='52' y='688' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  Box too heavy to collect</text><rect x='604' y='578' width='564' height='160' rx='12' fill='#F2F8FA' stroke='#16a34a' stroke-width='1.5'/><text x='624' y='606' font-size='13' fill='#16a34a' font-weight='700' text-anchor='start'>GAINS</text><text x='624' y='636' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  Knows the window the night before</text><text x='624' y='662' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  Chooses a safe place in one tap</text><text x='624' y='688' font-size='13' fill='#21313D' font-weight='400' text-anchor='start'>•  Arrives first time</text></svg>
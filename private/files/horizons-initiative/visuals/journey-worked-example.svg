<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700' width='1200' height='700' font-family='Poppins, Segoe UI, Arial, sans-serif'><title>Worked example — Mia&#x27;s current delivery journey</title><rect width='1200' height='700' fill='#fff'/><rect width='1200' height='74' fill='#14283F'/><text x='32' y='36' font-size='22' fill='#fff' font-weight='700' text-anchor='start'>Worked example — Mia&#x27;s current delivery journey</text><text x='32' y='60' font-size='13' fill='#B9D3DC' font-weight='400' text-anchor='start'>Illustrative · Southern Cross Freight case · the failed first attempt is where the outcome leaks</text><text x='1168' y='44' font-size='12' fill='#B9D3DC' font-weight='500' text-anchor='end'>BAS · Horizons: Initiative</text><rect x='32' y='96' width='168' height='48' fill='#14283F' stroke='#D5E2E7'/><text x='46' y='125.0' font-size='12' fill='#fff' font-weight='700' text-anchor='start'>STAGE</text><rect x='200.0' y='96' width='193.6' height='48' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='393.6' y='96' width='193.6' height='48' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='587.2' y='96' width='193.6' height='48' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='780.8' y='96' width='193.6' height='48' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='974.4' y='96' width='193.6' height='48' fill='#D9EBEF' stroke='#D5E2E7'/><rect x='32' y='144' width='168' height='62' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='180.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>DOES</text><rect x='200.0' y='144' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='144' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='144' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='144' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='974.4' y='144' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='32' y='206' width='168' height='62' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='242.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>THINKS</text><rect x='200.0' y='206' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='206' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='206' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='206' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='974.4' y='206' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='32' y='268' width='168' height='92' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='319.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>FEELS</text><rect x='200.0' y='268' width='193.6' height='92' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='268' width='193.6' height='92' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='268' width='193.6' height='92' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='268' width='193.6' height='92' fill='#fff' stroke='#D5E2E7'/><rect x='974.4' y='268' width='193.6' height='92' fill='#fff' stroke='#D5E2E7'/><rect x='32' y='360' width='168' height='52' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='391.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>ELAPSED</text><rect x='200.0' y='360' width='193.6' height='52' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='360' width='193.6' height='52' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='360' width='193.6' height='52' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='360' width='193.6' height='52' fill='#fff' stroke='#D5E2E7'/><rect x='974.4' y='360' width='193.6' height='52' fill='#fff' stroke='#D5E2E7'/><rect x='32' y='412' width='168' height='62' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='448.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>PAIN</text><rect x='200.0' y='412' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='412' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='412' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='412' width='193.6' height='62' fill='#fdecec' stroke='#D5E2E7'/><rect x='974.4' y='412' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='32' y='474' width='168' height='62' fill='#F2F8FA' stroke='#D5E2E7'/><text x='46' y='510.0' font-size='12' fill='#14283F' font-weight='700' text-anchor='start'>OPPORTUNITY</text><rect x='200.0' y='474' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='393.6' y='474' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='587.2' y='474' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='780.8' y='474' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><rect x='974.4' y='474' width='193.6' height='62' fill='#fff' stroke='#D5E2E7'/><text x='296.8' y='126' font-size='14' fill='#14283F' font-weight='700' text-anchor='middle'>Order</text><text x='296.8' y='180.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>Buys wardrobe online</text><text x='296.8' y='242.0' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='middle'>&quot;When will it come?&quot;</text><text x='296.8' y='391.0' font-size='12' fill='#21313D' font-weight='600' text-anchor='middle'>Day 0</text><text x='296.8' y='448.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>No delivery day given</text><text x='296.8' y='502.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>Ask for window at</text><text x='296.8' y='518.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>checkout</text><text x='490.40000000000003' y='126' font-size='14' fill='#14283F' font-weight='700' text-anchor='middle'>Dispatch</text><text x='490.40000000000003' y='180.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>Gets generic email</text><text x='490.40000000000003' y='242.0' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='middle'>&quot;In transit… where?&quot;</text><text x='490.40000000000003' y='391.0' font-size='12' fill='#21313D' font-weight='600' text-anchor='middle'>Day 1</text><text x='490.40000000000003' y='440.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>Tracking says only &quot;in</text><text x='490.40000000000003' y='456.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>transit&quot;</text><text x='490.40000000000003' y='502.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>Plain-language ETA by</text><text x='490.40000000000003' y='518.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>SMS</text><text x='684.0' y='126' font-size='14' fill='#14283F' font-weight='700' text-anchor='middle'>Wait</text><text x='684.0' y='172.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>Checks tracking, nothing</text><text x='684.0' y='188.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>new</text><text x='684.0' y='242.0' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='middle'>&quot;Do I swap my shift?&quot;</text><text x='684.0' y='391.0' font-size='12' fill='#21313D' font-weight='600' text-anchor='middle'>Day 1–3</text><text x='684.0' y='448.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>Can&#x27;t plan around shifts</text><text x='684.0' y='510.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>Notify before route lock</text><text x='877.5999999999999' y='126' font-size='14' fill='#14283F' font-weight='700' text-anchor='middle'>Attempt</text><text x='877.5999999999999' y='180.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>Not home — card left</text><text x='877.5999999999999' y='242.0' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='middle'>&quot;Nobody asked me!&quot;</text><text x='877.5999999999999' y='391.0' font-size='12' fill='#21313D' font-weight='600' text-anchor='middle'>Day 3</text><text x='877.5999999999999' y='448.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>Futile attempt</text><text x='877.5999999999999' y='502.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>One-tap confirm or safe</text><text x='877.5999999999999' y='518.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>drop</text><text x='1071.2' y='126' font-size='14' fill='#14283F' font-weight='700' text-anchor='middle'>Recover</text><text x='1071.2' y='180.0' font-size='12' fill='#21313D' font-weight='400' text-anchor='middle'>Drives to depot</text><text x='1071.2' y='242.0' font-size='12' fill='#5B6B75' font-weight='400' text-anchor='middle'>&quot;Too heavy for my car&quot;</text><text x='1071.2' y='391.0' font-size='12' fill='#21313D' font-weight='600' text-anchor='middle'>Day 5–6</text><text x='1071.2' y='448.0' font-size='12' fill='#dc2626' font-weight='600' text-anchor='middle'>Collection, 30 kg box</text><text x='1071.2' y='502.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>Re-book a window in one</text><text x='1071.2' y='518.0' font-size='12' fill='#16a34a' font-weight='600' text-anchor='middle'>tap</text><polyline points='296.8,293.6 490.40000000000003,310.6 684.0,326.24 877.5999999999999,344.6 1071.2,331.0' fill='none' stroke='#1789A0' stroke-width='3'/><circle cx='296.8' cy='293.6' r='7' fill='#1789A0'/><circle cx='490.40000000000003' cy='310.6' r='7' fill='#1789A0'/><circle cx='684.0' cy='326.24' r='7' fill='#1789A0'/><circle cx='877.5999999999999' cy='344.6' r='7' fill='#dc2626'/><circle cx='1071.2' cy='331.0' r='7' fill='#1789A0'/><text x='206' y='284' font-size='13' fill='#16a34a' font-weight='700' text-anchor='start'>+</text><text x='206' y='354' font-size='15' fill='#dc2626' font-weight='700' text-anchor='start'>−</text><rect x='32' y='558' width='1136' height='62' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><text x='50' y='584' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>READ IT</text><text x='50' y='604' font-size='12.5' fill='#21313D' font-weight='400' text-anchor='start'>Six days pass and nobody asks Mia a question until the attempt fails. The biggest dip sits exactly where our product outcome lives: confirm before route lock.</text></svg>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' width='1200' height='800' font-family='Poppins, Segoe UI, Arial, sans-serif'><title>Anatomy of an evidence-based persona</title><rect width='1200' height='800' fill='#fff'/><rect width='1200' height='74' fill='#14283F'/><text x='32' y='36' font-size='22' fill='#fff' font-weight='700' text-anchor='start'>Anatomy of an evidence-based persona</text><text x='32' y='60' font-size='13' fill='#B9D3DC' font-weight='400' text-anchor='start'>Every line on the card should trace to something you saw, heard or measured</text><text x='1168' y='44' font-size='12' fill='#B9D3DC' font-weight='500' text-anchor='end'>BAS · Horizons: Initiative</text><rect x='300' y='100' width='600' height='670' rx='14' fill='#fff' stroke='#14283F' stroke-width='2'/><rect x='300' y='100' width='600' height='120' rx='14' fill='#F2F8FA'/><circle cx='370' cy='160' r='42' fill='#D9EBEF'/><circle cx='370' cy='150.76' r='14.280000000000001' fill='#1789A0'/><path d='M343.96,186.04 a26.04,21.0 0 0 1 52.08,0' fill='#1789A0'/><text x='430' y='150' font-size='22' fill='#14283F' font-weight='700' text-anchor='start'>Mia — the receiver</text><text x='430' y='176' font-size='13' fill='#5B6B75' font-weight='400' text-anchor='start'>34 · shift-working nurse · orders bulky items online</text><text x='430' y='198' font-size='11' fill='#5B6B75' font-weight='400' text-anchor='start'>Illustrative persona · Southern Cross Freight case</text><text x='330' y='250' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>CONTEXT</text><text x='330' y='272' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Mostly uses her phone; works rotating night shifts.</text><text x='330' y='291' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>English is her second language.</text><text x='330' y='345' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>GOALS</text><text x='330' y='367' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Know the day and window the delivery will come.</text><text x='330' y='386' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Choose a safe place if she can&#x27;t be home.</text><text x='330' y='440' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>PAIN POINTS</text><text x='330' y='462' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Already missed one delivery on a night shift.</text><text x='330' y='481' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>A 30 kg box is too heavy to collect from the depot.</text><text x='330' y='535' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>CONSTRAINTS</text><text x='330' y='557' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Can&#x27;t take calls on the ward.</text><text x='330' y='576' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Needs plain language, one-tap actions.</text><text x='330' y='630' font-size='11' fill='#1789A0' font-weight='700' text-anchor='start'>SUCCESS LOOKS LIKE</text><text x='330' y='652' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>Confirms a window or safe drop in under a minute,</text><text x='330' y='671' font-size='14' fill='#21313D' font-weight='400' text-anchor='start'>and the parcel arrives first time.</text><rect x='300' y='710' width='600' height='60' fill='#D9EBEF'/><text x='330' y='735' font-size='11' fill='#0E6E80' font-weight='700' text-anchor='start'>EVIDENCE</text><text x='330' y='756' font-size='12.5' fill='#21313D' font-weight='400' text-anchor='start'>6 receiver interviews · 1,240 missed-delivery complaints · tracking analytics (Q2)</text><line x1='280' y1='150' x2='300' y2='150' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='30' y='112' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='50' cy='136' r='13' fill='#1789A0'/><text x='50' y='141' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>1</text><text x='70' y='141' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Name + role, not demographics</text><text x='44' y='162' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Give a role-led headline. Age and </text><text x='44' y='177' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>photo are optional — behaviour </text><text x='44' y='192' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>matters more. </text><line x1='280' y1='268' x2='300' y2='268' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='30' y='230' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='50' cy='254' r='13' fill='#1789A0'/><text x='50' y='259' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>2</text><text x='70' y='259' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Context shapes design</text><text x='44' y='280' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Where, when and on what device they </text><text x='44' y='295' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>meet your product. </text><line x1='280' y1='363' x2='300' y2='363' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='30' y='325' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='50' cy='349' r='13' fill='#1789A0'/><text x='50' y='354' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>3</text><text x='70' y='354' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Goals are their goals</text><text x='44' y='375' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>What the actor wants — not what you </text><text x='44' y='390' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>want them to do. </text><line x1='900' y1='458' x2='920' y2='458' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='920' y='420' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='940' cy='444' r='13' fill='#1789A0'/><text x='940' y='449' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>4</text><text x='960' y='449' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Pains explain the gap</text><text x='934' y='470' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Pick pains that explain why the </text><text x='934' y='485' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>outcome is missed today. </text><line x1='900' y1='553' x2='920' y2='553' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='920' y='515' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='940' cy='539' r='13' fill='#1789A0'/><text x='940' y='544' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>5</text><text x='960' y='544' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Constraints = requirements</text><text x='934' y='565' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>Accessibility, language, device, </text><text x='934' y='580' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>time, policy. </text><line x1='900' y1='648' x2='920' y2='648' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='920' y='610' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='940' cy='634' r='13' fill='#1789A0'/><text x='940' y='639' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>6</text><text x='960' y='639' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Success = a behaviour</text><text x='934' y='660' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>This becomes the impact on your </text><text x='934' y='675' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>impact map. </text><line x1='900' y1='740' x2='920' y2='740' stroke='#1789A0' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='920' y='702' width='250' height='84' rx='10' fill='#F2F8FA' stroke='#D5E2E7' stroke-width='1.5'/><circle cx='940' cy='726' r='13' fill='#1789A0'/><text x='940' y='731' font-size='13' fill='#fff' font-weight='700' text-anchor='middle'>7</text><text x='960' y='731' font-size='12.5' fill='#14283F' font-weight='700' text-anchor='start'>Evidence strip</text><text x='934' y='752' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>No evidence? Mark the line as an </text><text x='934' y='767' font-size='11.5' fill='#5B6B75' font-weight='400' text-anchor='start'>assumption to test. </text></svg>
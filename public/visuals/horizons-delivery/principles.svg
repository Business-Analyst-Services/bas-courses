<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="The nine principles of agile business analysis" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>The nine principles of agile business analysis</title><rect width="760" height="340" rx="14" fill="#fff"/><text x="380" y="35.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">Nine principles — STAG US Pursue, Avoid and Embrace</text><rect x="20" y="56" width="233" height="80" rx="10" fill="#D9EBEF" stroke="#1789A0"/><circle cx="54" cy="96" r="20" fill="#14283F"/><text x="54" y="101.6" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">S</text><text x="164" y="100.4" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">See the Whole</text><rect x="265" y="56" width="233" height="80" rx="10" fill="#D9EBEF" stroke="#1789A0"/><circle cx="299" cy="96" r="20" fill="#14283F"/><text x="299" y="101.6" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">T</text><text x="409" y="100.4" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">Think as a Customer</text><rect x="510" y="56" width="233" height="80" rx="10" fill="#D9EBEF" stroke="#1789A0"/><circle cx="544" cy="96" r="20" fill="#14283F"/><text x="544" y="101.6" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">A</text><text x="654" y="92.6" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">Analyze to Determine</text><text x="654" y="108.2" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">What is Valuable</text><rect x="20" y="148" width="233" height="80" rx="10" fill="#D9EBEF" stroke="#1789A0"/><circle cx="54" cy="188" r="20" fill="#14283F"/><text x="54" y="193.6" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">G</text><text x="164" y="184.6" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">Get Real Using</text><text x="164"
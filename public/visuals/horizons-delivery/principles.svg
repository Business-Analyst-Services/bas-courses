="16" fill="#fff" font-weight="700" text-anchor="middle">E</text><text x="654" y="276.6" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">Embrace Uncertainty</text><text x="654" y="292.2" font-size="12.5" fill="#14283F" font-weight="600" text-anchor="middle">and Change</text></svg>
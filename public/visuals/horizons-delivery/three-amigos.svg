<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="The Three Amigos" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>The Three Amigos</title><rect width="760" height="480" rx="14" fill="#fff"/><text x="380" y="35.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">The Three Amigos: three mindsets, one backlog item</text><circle cx="290" cy="175" r="115" fill="#1789A0" fill-opacity=".18" stroke="#1789A0" stroke-width="1.5"/><circle cx="470" cy="175" r="115" fill="#1789A0" fill-opacity=".18" stroke="#1789A0" stroke-width="1.5"/><circle cx="380" cy="320" r="115" fill="#1789A0" fill-opacity=".18" stroke="#1789A0" stroke-width="1.5"/><text x="240" y="127.2" font-size="15" fill="#14283F" font-weight="700" text-anchor="middle">Analyst</text><text x="240" y="154.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">What problem?</text><text x="240" y="169.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">What is valuable?</text><text x="520" y="127.2" font-size="15" fill="#14283F" font-weight="700" text-anchor="middle">Developer</text><text x="520" y="154.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">How could</text><text x="520" y="169.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">we build it?</text><text x="380" y="347.2" font-size="15" fill="#14283F" font-weight="700" text-anchor="middle">Tester</text><text x="380" y="374.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">What could</text><text x="380" y="389.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">go wrong?</text><text x="380" y="218.4" font-size="13" fill="#0E6E80" font-weight="700" text-anchor="middle">Examples &amp;</text><text x="380" y="234.7" font-size="13" fill="#0E6E80" font-weight="700" text-anchor="middle">criteria</text><text x="380" y="464.0" font-size="11.5" fill="#5B6B75" font-weight="400" text-anchor="middle">3–5 people · before the team commits · output: shared understanding, examples and criteria — not a document</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="Feedback sources at the Delivery Horizon" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>Feedback sources at the Delivery Horizon</title><rect width="760" height="312" rx="14" fill="#fff"/><text x="380" y="37.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">Where Delivery feedback comes from — and where it goes</text><rect x="20" y="60" width="170" height="46" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="105.0" y="87.7" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">During the iteration</text><rect x="20" y="112" width="170" height="70" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="105.0" y="143.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Developer and tester</text><text x="105.0" y="158.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">questions; edge cases</text><rect x="202" y="60" width="170" height="46" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="287.0" y="87.7" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">Refinement</text><rect x="202" y="112" width="170" height="70" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="287.0" y="143.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Stakeholders react to</text><text x="287.0" y="158.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">prototypes and examples</text><rect x="384" y="60" width="170" height="46" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="469.0" y="87.7" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">Iteration review</text><rect x="384" y="112" width="170" height="70" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="469.0" y="143.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Users and stakeholders</text><text x="469.0" y="158.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">evaluate the increment</text><rect x="566" y="60" width="170" height="46" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="651.0" y="87.7" font-size="13.5" fill="#fff" font-weight="600" text-anchor="middle">Retrospective</text><rect x="566" y="112" width="170" height="70" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="651.0" y="143.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">The team reflects on</text><text x="651.0" y="158.7" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">its analysis process</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1789A0"/></marker></defs><line x1="380" y1="190" x2="380" y2="228" stroke="#1789A0" stroke-width="2.2" marker-end="url(#ah)"/><rect x="110" y="232" width="540" height="60" rx="10" fill="#F2F8FA" stroke="#1789A0" stroke-width="1.5"/><text x="380.0" y="258.4" font-size="13" fill="#14283F" font-weight="500" text-anchor="middle">The Agile BA turns signals into action: better next backlog items,</text><text x="380.0" y="274.7" font-size="13" fill="#14283F" font-weight="500" text-anchor="middle">feedback to the Product Owner, revised assumptions about value</text></svg>
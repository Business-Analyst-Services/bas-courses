<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 324" width="804" height="324" role="img" aria-label="Scrum and Kanban: what changes for the Agile BA" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>Scrum and Kanban: what changes for the Agile BA</title><rect width="804" height="324" rx="14" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1789A0"/></marker></defs><text x="400" y="35.6" font-size="16" fill="#14283F" font-weight="600" text-anchor="middle">Same analysis job, different rhythm</text><text x="200" y="69.2" font-size="15" fill="#14283F" font-weight="700" text-anchor="middle">Scrum (iterations)</text><text x="600" y="69.2" font-size="15" fill="#14283F" font-weight="700" text-anchor="middle">Kanban (continuous flow)</text><rect x="30" y="84" width="110" height="64" rx="10" fill="#D9EBEF" stroke="#1789A0"/><text x="85" y="108.5" font-size="13" fill="#14283F" font-weight="600" text-anchor="middle">Sprint 1</text><text x="85" y="132.0" font-size="11.5" fill="#5B6B75" font-weight="400" text-anchor="middle">2 weeks</text><rect x="150" y="84" width="110" height="64" rx="10" fill="#D9EBEF" stroke="#1789A0"/><text x="205" y="108.5" font-size="13" fill="#14283F" font-weight="600" text-anchor="middle">Sprint 2</text><text x="205" y="132.0" font-size="11.5" fill="#5B6B75" font-weight="400" text-anchor="middle">2 weeks</text><rect x="270" y="84" width="110" height="64" rx="10" fill="#D9EBEF" stroke="#1789A0"/><text x="325" y="108.5" font-size="13" fill="#14283F" font-weight="600" text-anchor="middle">Sprint 3</text><text x="325" y="132.0" font-size="11.5" fill="#5B6B75" font-weight="400" text-anchor="middle">2 weeks</text><text x="200" y="176.2" font-size="12" fill="#5B6B75" font-weight="400" text-anchor="middle">Plan → build → review → retro, every sprint</text><rect x="30" y="186" width="350" height="54" rx="10" fill="#F2F8FA" stroke="#D5E2E7" 
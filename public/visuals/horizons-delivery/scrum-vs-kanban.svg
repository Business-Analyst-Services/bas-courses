ke-width="1.5"/><text x="597.0" y="209.7" font-size="12" fill="#21313D" font-weight="500" text-anchor="middle">Keep the Ready column topped up · no commitment point</text><text x="597.0" y="224.7" font-size="12" fill="#21313D" font-weight="500" text-anchor="middle">Measure: cycle time, items blocked</text><rect x="30" y="258" width="744" height="46" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="402.0" y="285.6" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Both: elaborate just in time · Three Amigos before work starts · examples → criteria · validate in review</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Backlog readiness by distance from delivery" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>Backlog readiness by distance from delivery</title><rect width="760" height="430" rx="14" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1789A0"/></marker></defs><text x="380" y="37.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">A well-prepared product backlog: elaborate just in time, not just in case</text><rect x="50.0" y="60" width="660" height="70" rx="10" fill="#14283F" stroke="#1789A0" stroke-width="1.2"/><text x="380" y="89.2" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Current iteration</text><text x="380" y="112.4" font-size="12.5" fill="#fff" font-weight="400" text-anchor="middle">Elaborated just before or as it is picked up</text><rect x="85.0" y="142" width="590" height="70" rx="10" fill="#1789A0" stroke="#1789A0" stroke-width="1.2"/><text x="380" y="171.2" font-size="15" fill="#fff" font-weight="600" text-anchor="middle">Next 1–2 iterations</text><text x="380" y="194.4" font-size="12.5" fill="#fff" font-weight="400" text-anchor="middle">Ready: estimable, criteria clear, risks known</text><rect x="120.0" y="224" width="520" height="70" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.2"/><text x="380" y="253.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">Later</text><text x="380" y="276.4" font-size="12.5" fill="#14283F" font-weight="400" text-anchor="middle">Understood well enough to order and roughly size</text><rect x="155.0" y="306" width="450" height="70" rx="10" fill="#F2F8FA" stroke="#1789A0" stroke-width="1.2"/><text x="380" y="335.2" font-size="15" fill="#5B6B75" font-weight="600" text-anchor="middle">Much later</text><text x="380" y="358.4" font-size="12.5" fill="#5B6B75" font-weight="400" text-anchor="middle">A line on the backlog — over-elaborating here is waste</text><line x1="60" y1="380" x2="60" y2="70" stroke="#1789A0" stroke-width="2.2" marker-end="url(#ah)"/><text x="52" y="414.2" font-size="12" fill="#5B6B75" font-weight="600" text-anchor="start">Detail</text></svg>
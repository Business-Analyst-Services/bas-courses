<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" width="800" height="292" role="img" aria-label="From examples to acceptance criteria" font-family="Poppins, Segoe UI, Arial, sans-serif"><title>From examples to acceptance criteria</title><rect width="800" height="292" rx="14" fill="#fff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1789A0"/></marker></defs><text x="400" y="35.2" font-size="15" fill="#14283F" font-weight="600" text-anchor="middle">Story elaboration: examples first, criteria follow</text><rect x="20" y="60" width="230" height="150" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="135" y="86.9" font-size="14" fill="#14283F" font-weight="600" text-anchor="middle">Concrete examples</text><text x="135" y="114.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">House, home → confirm</text><text x="135" y="129.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">House, at work → porch</text><text x="135" y="144.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Small business → no login</text><text x="135" y="159.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Link after route lock</text><text x="135" y="174.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">→ expired</text><line x1="255" y1="135" x2="290" y2="135" stroke="#1789A0" stroke-width="2.2" marker-end="url(#ah)"/><rect x="295" y="60" width="230" height="150" rx="10" fill="#D9EBEF" stroke="#1789A0" stroke-width="1.5"/><text x="410" y="86.9" font-size="14" fill="#14283F" font-weight="600" text-anchor="middle">Acceptance criteria</text><text x="410" y="114.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">Given a link opened</text><text x="410" y="129.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">after route lock,</text><text x="410" y="144.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">when it loads,</text><text x="410" y="159.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">then the receiver sees an</text><text x="410" y="174.2" font-size="12" fill="#21313D" font-weight="400" text-anchor="middle">expiry message and no data</text><line x1="530" y1="135" x2="565" y2="135" stroke="#1789A0" stroke-width="2.2" marker-end="url(#ah)"/><rect x="570" y="60" width="210" height="150" rx="10" fill="#14283F" stroke="#14283F" stroke-width="1.5"/><text x="675" y="86.9" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Executable spec</text><text x="675" y="121.7" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">With behaviour-driven</text><text x="675" y="136.7" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">development, the same</text><text x="675" y="151.7" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">scenarios become</text><text x="675" y="166.7" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">automated tests</text><rect x="20" y="228" width="760" height="44" rx="10" fill="#F2F8FA" stroke="#D5E2E7" stroke-width="1.5"/><text x="400.0" y="254.2" font-size="12" fill="#5B6B75" font-weight="500" text-anchor="middle">Plus what the conversation surfaced: clarifications, NFRs, metrics, and wireframes where they cut ambiguity</text></svg>